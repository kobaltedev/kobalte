packages:
  - apps/*
  - packages/*
catalog:
  # Solid 2.0 core — keep these three in lockstep on the same version
  solid-js: 2.0.4
  "@solidjs/web": 2.0.4
  "@solidjs/signals": 2.0.4
  # Only release compatible with Solid 2.x (`latest` still targets Solid 1); intentionally a prerelease
  "@solidjs/testing-library": 1.0.0-rc.2
  # Build tooling shared across root + published packages
  typescript: 7.0.2
  tsdown: 0.23.7
  unplugin-solid: 3.0.0
  vitest: 5.1.2
  # solid-primitives — versions mirrored in the overrides block below
  "@solid-primitives/a11y": 1.0.0
  "@solid-primitives/controlled-signal": 1.0.0
  "@solid-primitives/event-listener": 3.0.0
  "@solid-primitives/focus": 1.0.0
  "@solid-primitives/form": 1.0.1
  "@solid-primitives/i18n": 3.0.1
  "@solid-primitives/interaction": 1.1.0
  "@solid-primitives/keyboard": 2.1.0
  "@solid-primitives/keyed": 3.0.0
  "@solid-primitives/map": 1.0.0
  "@solid-primitives/media": 4.0.0
  "@solid-primitives/platform": 1.0.0
  "@solid-primitives/presence": 1.1.0
  "@solid-primitives/props": 4.0.0
  "@solid-primitives/refs": 3.0.0
  "@solid-primitives/resize-observer": 4.1.0
  "@solid-primitives/scroll": 3.1.0
  "@solid-primitives/upload": 1.0.0
  "@solid-primitives/utils": 7.0.1
overrides:
  # Keep signals in lockstep with the catalog (overrides can't use catalog:)
  "@solidjs/signals": "2.0.4"
  "@solidjs/testing-library": "1.0.0-rc.2"
  "@solidjs/compiler": "2.0.3"
  "@solidjs/babel-plugin": "2.0.3"
  "@solid-primitives/a11y": "1.0.0"
  "@solid-primitives/controlled-signal": "1.0.0"
  "@solid-primitives/event-listener": "3.0.0"
  "@solid-primitives/focus": "1.0.0"
  "@solid-primitives/form": "1.0.1"
  "@solid-primitives/i18n": "3.0.1"
  "@solid-primitives/interaction": "1.1.0"
  "@solid-primitives/keyboard": "2.1.0"
  "@solid-primitives/keyed": "3.0.0"
  "@solid-primitives/map": "1.0.0"
  "@solid-primitives/media": "4.0.0"
  "@solid-primitives/platform": "1.0.0"
  "@solid-primitives/presence": "1.1.0"
  "@solid-primitives/props": "4.0.0"
  "@solid-primitives/refs": "3.0.0"
  "@solid-primitives/resize-observer": "4.1.0"
  "@solid-primitives/rootless": "2.0.0"
  "@solid-primitives/scroll": "3.1.0"
  "@solid-primitives/static-store": "1.0.0"
  "@solid-primitives/trigger": "3.0.0"
  "@solid-primitives/upload": "1.0.0"
  "@solid-primitives/utils": "7.0.1"
  "@storybook/builder-vite": "10.6.9"
allowBuilds:
  "@biomejs/biome": false
  "@parcel/watcher": false
  esbuild: false
minimumReleaseAgeExclude:
  - "@solid-primitives/a11y@1.0.0"
  - "@solid-primitives/controlled-signal@1.0.0"
  - "@solid-primitives/event-listener@3.0.0"
  - "@solid-primitives/focus@1.0.0"
  - "@solid-primitives/form@1.0.1"
  - "@solid-primitives/i18n@3.0.1"
  - "@solid-primitives/interaction@1.1.0"
  - "@solid-primitives/keyboard@2.1.0"
  - "@solid-primitives/keyed@3.0.0"
  - "@solid-primitives/map@1.0.0"
  - "@solid-primitives/media@4.0.0"
  - "@solid-primitives/platform@1.0.0"
  - "@solid-primitives/presence@1.1.0"
  - "@solid-primitives/props@4.0.0"
  - "@solid-primitives/refs@3.0.0"
  - "@solid-primitives/resize-observer@4.1.0"
  - "@solid-primitives/rootless@2.0.0"
  - "@solid-primitives/scroll@3.1.0"
  - "@solid-primitives/static-store@1.0.0"
  - "@solid-primitives/trigger@3.0.0"
  - "@solid-primitives/upload@1.0.0"
  - "@solid-primitives/utils@7.0.1"
  - rolldown-plugin-dts@0.27.8
  - tsdown@0.23.7
  - "@solidjs/babel-plugin@2.0.3"
  - "@solidjs/compiler@2.0.3"
  - "@solidjs/signals@2.0.4"
  - "@solidjs/web@2.0.4"
  - solid-js@2.0.4
dedupePeerDependents: true
